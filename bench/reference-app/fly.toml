# Fly.io configuration for the reference app.
# Change `app` to a unique name and `primary_region` to the region under test.
app = "wakeit-ref-CHANGE-ME"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  # "stop" (not "suspend"): a stopped Machine starts a new process, so the boot
  # ID changes and the harness can prove a cold start happened.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
